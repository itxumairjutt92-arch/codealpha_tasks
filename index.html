<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<style>
:root{--bg:#0b0a1a;--text:#f5f3ff;--muted:#a8a3cf;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--track:rgba(255,255,255,.18);--a:#ff6ec4;--b:#7873f5;--g1:#7c3aed55;--g2:#ec489955;--c1:#7c3aed;--c2:#ec4899;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2ff;--text:#241b4b;--muted:#6b6494;--card:rgba(255,255,255,.75);--line:rgba(60,40,120,.15);--track:rgba(60,40,120,.18)}}
:root[data-theme="dark"]{--bg:#0b0a1a;--text:#f5f3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:radial-gradient(900px 520px at 10% 0%,var(--g1),transparent 60%),radial-gradient(800px 520px at 100% 100%,var(--g2),transparent 60%),var(--bg) fixed}
.app{width:min(1000px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.player{text-align:center}
.disc{width:min(240px,62vw);aspect-ratio:1;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--c1),var(--c2),var(--c1));box-shadow:0 0 0 10px rgba(255,255,255,.06),0 20px 50px var(--g1);animation:spin 8s linear infinite;animation-play-state:paused}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 6px,rgba(0,0,0,.09) 6px 7px)}
.disc span{width:46%;aspect-ratio:1;border-radius:50%;background:rgba(10,8,30,.55);display:grid;place-items:center;font-size:2.6rem;position:relative}
.disc.play{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.viz{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:36px;margin-bottom:12px}
.viz i{width:5px;height:6px;border-radius:3px;background:linear-gradient(var(--a),var(--b));animation:eq 1s ease-in-out infinite alternate;animation-play-state:paused}
.viz.play i{animation-play-state:running}
@keyframes eq{to{height:34px}}
h2{margin:6px 0 2px;font-size:1.6rem}
.artist{margin:0;color:var(--muted)}
.seek{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.85rem;color:var(--muted);margin:20px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b)) 0/var(--p,0%) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .2s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.3)}
.ctrls{display:flex;justify-content:center;align-items:center;gap:10px}
button.ic{background:none;border:0;color:var(--text);cursor:pointer;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:.25s}
button.ic:hover{background:var(--card);transform:scale(1.1)}
button.ic svg{width:24px;height:24px}
button.sm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.on{color:var(--a)}
button.ps{width:68px;height:68px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 10px 30px var(--g1)}
button.ps:hover{background:linear-gradient(135deg,var(--a),var(--b))}
button.ps svg{width:30px;height:30px}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px}
.vol{display:flex;align-items:center;gap:6px;flex:1;min-width:170px}
.auto{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer}
.auto input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--track);position:relative;cursor:pointer;transition:.3s}
.auto input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.3s}
.auto input:checked{background:linear-gradient(90deg,var(--a),var(--b))}
.auto input:checked::after{left:19px}
.list h3{margin:0 0 14px}
ul{list-style:none;padding:0;margin:0;max-height:520px;overflow:auto;display:grid;gap:8px}
li{display:grid;grid-template-columns:22px 46px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;cursor:pointer;border:1px solid transparent;transition:.25s}
li:hover{background:var(--card);transform:translateX(4px)}
li.act{background:linear-gradient(90deg,rgba(255,110,196,.2),rgba(120,115,245,.2));border-color:var(--line)}
.th{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem}
li b{display:block;font-size:.95rem}
li small,.num,.dur{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main class="app">
  <section class="card player">
    <div class="disc" id="disc"><span id="emoji"></span></div>
    <div class="viz" id="viz"></div>
    <h2 id="title"></h2>
    <p class="artist" id="artist"></p>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progress"><span id="dur">0:00</span></div>
    <div class="ctrls">
      <button class="ic sm" id="shuf" title="Shuffle" aria-label="Shuffle"></button>
      <button class="ic" id="prev" title="Previous" aria-label="Previous"></button>
      <button class="ic ps" id="play" title="Play / Pause" aria-label="Play or pause"></button>
      <button class="ic" id="next" title="Next" aria-label="Next"></button>
      <button class="ic sm" id="rep" title="Repeat track" aria-label="Repeat"></button>
    </div>
    <div class="bottom">
      <div class="vol"><button class="ic sm" id="mute" aria-label="Mute"></button><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>
      <label class="auto"><input type="checkbox" id="auto" checked> Autoplay next</label>
    </div>
  </section>
  <section class="card list"><h3>Playlist</h3><ul id="pl"></ul></section>
</main>
<script>

const tracks=[
 {title:'Midnight Drive',artist:'Aurora Beats',emoji:'🌃',c1:'#7c3aed',c2:'#ec4899',root:220,scale:[0,2,3,5,7,8,10],bpm:110,bright:1,hat:1,seed:3},
 {title:'Ocean Breeze',artist:'Luna Waves',emoji:'🌊',c1:'#06b6d4',c2:'#3b82f6',root:261.63,scale:[0,2,4,7,9],bpm:90,seed:7},
 {title:'Golden Hour',artist:'Echo Park',emoji:'🌅',c1:'#f59e0b',c2:'#ef4444',root:196,scale:[0,2,4,5,7,9,11],bpm:120,bright:1,hat:1,seed:11},
 {title:'Starlight',artist:'Nova',emoji:'✨',c1:'#6366f1',c2:'#14b8a6',root:246.94,scale:[0,3,5,7,10],bpm:100,seed:19},
 {title:'Rainy Café',artist:'Lo-Fi Lab',emoji:'☕',c1:'#10b981',c2:'#84cc16',root:233.08,scale:[0,2,3,5,7,9,10],bpm:80,hat:1,seed:23}
];
function synth(t){
  const sr=22050,step=30/t.bpm,steps=14*8,n=Math.floor(steps*step*sr)+sr,buf=new Float32Array(n);
  let s=t.seed,deg=0;const rnd=()=>(s=(s*9301+49297)%233280)/233280,prog=[0,5,3,4],L=t.scale.length;
  const note=(f,st,dur,vol)=>{const a=Math.floor(st*sr),l=Math.floor(dur*sr);
    for(let i=0;i<l&&a+i<n;i++){const x=i/sr,e=Math.min(1,x*60)*Math.exp(-x*5/dur),p=6.2832*f*x;
      buf[a+i]+=vol*e*(Math.sin(p)+(t.bright?.4*Math.sin(2*p)+.2*Math.sin(3*p):.15*Math.sin(2*p)))}};
  for(let k=0;k<steps;k++){
    if(rnd()>.18){deg=Math.max(0,Math.min(L*2-1,deg+Math.floor(rnd()*5)-2));
      note(t.root*2**((t.scale[deg%L]+12*Math.floor(deg/L))/12)*2,k*step,step*1.8,.22)}
    if(k%4===0)note(t.root*2**(t.scale[prog[Math.floor(k/8)%4]%L]/12)/2,k*step,step*3.5,.3);
    if(t.hat&&k%2===1){const a=Math.floor(k*step*sr);for(let i=0;i<700&&a+i<n;i++)buf[a+i]+=(rnd()*2-1)*.06*Math.exp(-i/150)}
  }
  let m=0;for(let i=0;i<n;i++)m=Math.max(m,Math.abs(buf[i]));
  const dv=new DataView(new ArrayBuffer(44+n*2)),w=(o,str)=>[...str].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)dv.setInt16(44+i*2,buf[i]/m*.85*32767,true);
  t.len=n/sr;return URL.createObjectURL(new Blob([dv],{type:'audio/wav'}));
}
tracks.forEach(t=>{if(!t.url)t.url=synth(t)});

const $=id=>document.getElementById(id),audio=new Audio();
const svg=p=>`<svg viewBox="0 0 24 24" fill="currentColor">${p}</svg>`,
 st=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const I={play:svg('<path d="M8 5v14l11-7z"/>'),pause:svg('<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'),
 prev:svg('<path d="M6 6h2v12H6zM9.5 12L18 6v12z"/>'),next:svg('<path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/>'),
 shuf:st('<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),
 rep:st('<path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>'),
 vol:l=>st('<path d="M11 5L6 9H2v6h4l5 4V5z"/>'+(l===0?'<path d="M23 9l-6 6M17 9l6 6"/>':l===1?'<path d="M15.5 8.5a5 5 0 010 7"/>':'<path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/>'))};
$('prev').innerHTML=I.prev;$('next').innerHTML=I.next;$('shuf').innerHTML=I.shuf;$('rep').innerHTML=I.rep;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const fill=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');
let cur=0,shuffle=false,repeat=false;

for(let i=0;i<28;i++){const b=document.createElement('i');b.style.animationDuration=(.5+Math.random()*.8)+'s';b.style.animationDelay=-Math.random()+'s';$('viz').appendChild(b)}
tracks.forEach((t,i)=>{const li=document.createElement('li');
  li.innerHTML=`<span class="num">${i+1}</span><div class="th" style="background:linear-gradient(135deg,${t.c1},${t.c2})">${t.emoji}</div><div><b>${t.title}</b><small>${t.artist}</small></div><span class="dur">${fmt(t.len)}</span>`;
  li.onclick=()=>load(i,true);$('pl').appendChild(li)});

function load(i,go){
  cur=i;const t=tracks[i],r=document.documentElement.style;
  audio.src=t.url;$('title').textContent=t.title;$('artist').textContent=t.artist;$('emoji').textContent=t.emoji;
  r.setProperty('--c1',t.c1);r.setProperty('--c2',t.c2);r.setProperty('--g1',t.c1+'55');r.setProperty('--g2',t.c2+'55');
  [...$('pl').children].forEach((li,k)=>li.classList.toggle('act',k===i));
  $('seek').value=0;fill($('seek'));$('cur').textContent='0:00';$('dur').textContent=fmt(t.len);
  if(go)audio.play().catch(()=>{});
}
function next(){load(shuffle&&tracks.length>1?pick():(cur+1)%tracks.length,true)}
function pick(){let k;do{k=Math.floor(Math.random()*tracks.length)}while(k===cur);return k}
function prev(){audio.currentTime>3?audio.currentTime=0:load((cur-1+tracks.length)%tracks.length,true)}
const toggle=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();

$('play').onclick=toggle;$('next').onclick=next;$('prev').onclick=prev;
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat)};
audio.onplay=audio.onpause=()=>{const p=!audio.paused;$('play').innerHTML=p?I.pause:I.play;$('disc').classList.toggle('play',p);$('viz').classList.toggle('play',p)};
audio.onloadedmetadata=()=>$('dur').textContent=fmt(audio.duration);
audio.ontimeupdate=()=>{if(!audio.duration)return;$('seek').value=audio.currentTime/audio.duration*1000;fill($('seek'));$('cur').textContent=fmt(audio.currentTime)};
audio.onended=()=>{if(repeat){audio.currentTime=0;audio.play()}else if($('auto').checked)next();else{audio.currentTime=0;audio.pause()}};
$('seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration;fill(e.target)};
function vol(){audio.volume=+$('vol').value;fill($('vol'));const v=audio.muted?0:audio.volume;$('mute').innerHTML=I.vol(v===0?0:v<.5?1:2)}
$('vol').oninput=()=>{audio.muted=false;vol()};
$('mute').onclick=()=>{audio.muted=!audio.muted;vol()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox'||e.target.tagName==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
vol();load(0,false);$('play').innerHTML=I.play;
</script>
</body>
</html>
